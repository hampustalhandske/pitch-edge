id: bookmaker-line-structure-open-consensus-gap-v1
family: bookmaker-line-structure
registered_at: 2026-10-20T18:00:00Z
author: quant-researcher
study_dir: research/studies/r2-q2-open-consensus-gap
question: >
  Is the Pinnacle 1X2 move from the football-data.co.uk "open" (pre-closing) snapshot to the close predictable
  from information in that same snapshot: the gap between Pinnacle and the de-vigged soft-book consensus
  (avg_*_open) and the gap between Pinnacle and the best price (max_*_open)? Does backing the outcome the
  consensus rates higher than Pinnacle, at the Pinnacle open price, beat the de-vigged Pinnacle close?
hypothesis:
  h1_predict: >
    A linear model of move = logit(p_pin_close) - logit(p_pin_open) on g_avg = logit(p_avg_open) - logit(p_pin_open)
    and g_max = log(max_open / pinnacle_open), fit on the exploratory window, has out-of-sample R^2 > 0 in the
    evaluation window.
  h1_strategy: mean CLV > 0 for the paper strategy below.
  h0: OOS R^2 <= 0; mean CLV <= 0.
  direction: positive
  disconfirming: >
    95% CI of mean CLV includes 0 or is below it; or the sign flips in 2 of 3 chronological thirds; or the
    effect is carried by one division. For predictability: OOS R^2 CI includes 0.
decision_time: >
  The football-data.co.uk pre-closing snapshot. notes.txt (https://www.football-data.co.uk/notes.txt, fetched
  2026-10-20): "These are for pre-closing odds. For the closing odds, as below but with an additional "C"
  character ..." and "Betting odds for weekend games are collected Friday afternoons, and on Tuesday afternoons
  for midweek games." So "open" is NOT the first line a book posted; it is a snapshot taken on Friday or Tuesday
  afternoon, typically 1-3 days before kickoff. A bet "at open" means a bet placed at that snapshot.
point_in_time:
  features: [pinnacle_*_open, avg_*_open, max_*_open]   # all from the same pre-closing snapshot
  forbidden_as_features: [any *_close column, ft_* results]
  assertion: code builds features through a whitelist of *_open columns and asserts no *_close column is read
  caveat: >
    No per-row publication timestamp exists in fd_matches (scraped_at is the lake's scrape time in 2026). That
    Pinnacle, average and max odds were captured at the same instant is assumed from notes.txt, not verifiable.
universe: >
  fd_matches main-league divisions (mmz4281 files) with all of pinnacle_*_open, pinnacle_*_close, avg_*_open,
  max_*_open and a full-time result.
data_snapshot: data/research/r2/fd.parquet (lake fd_matches pulled 2026-10-20T17:56:52Z)
window:
  exploratory: [2012-07-01, 2019-06-30]   # 52.2k eligible matches; Betbrain max/avg columns
  evaluation:  [2019-07-01, 2025-06-30]   # 45.5k eligible matches, 2,034 match-days; market Max/Avg columns
  post_segment: [2025-07-01, 2026-10-19]  # reported separately; benchmark Betfair Exchange close
  window_justification: >
    The 2019/20 split coincides with football-data's switch from Betbrain max/avg to market Max/Avg columns,
    so the evaluation window is also a test of whether anything survives that change of definition.
strategy:
  rule: >
    At the snapshot compute p_pin_open and p_avg_open by power de-vig; gap_o = p_avg_open[o] - p_pin_open[o]
    for o in {H, D, A}; take the outcome with the largest gap; bet 1 unit if gap > theta, at pinnacle_o_open.
    At most one bet per match.
  price_taken: pinnacle_*_open (vig-inclusive, as a bettor would get it)
benchmark: Pinnacle close de-vigged by power (Shin and multiplicative as labelled sensitivities); post segment Betfair Exchange close de-vigged by power
primary_metric: clv_log = log(odds_taken * p_close_devig[o]), mean per bet
secondary_metrics: [roi (flat stakes, never primary), hit rate, baseline CLV of betting every outcome at Pinnacle open, OLS slopes of move on g_avg and g_max]
costs: the Pinnacle margin is inside the taken price; no other costs (no commission at Pinnacle)
grid:
  theta: [0.00, 0.01, 0.02, 0.03, 0.05]
sensitivities_counted_as_trials:
  - theta=0.02 with Shin-de-vigged close
  - theta=0.02 with multiplicative-de-vigged close
data_quality_rule: >
  Rows whose max_*_open exceeds 1.5x pinnacle_*_open for the same outcome are treated as data errors for the
  g_max feature (feature set to the cap 1.5); registered before any outcome was examined.
uncertainty: block bootstrap by match-day, 2,000 resamples, percentile 95% CI; one-sided p from bootstrap SE
stability: chronological thirds of the evaluation window (2019/20-20/21, 21/22-22/23, 23/24-24/25), per division, leave-one-division-out
graded_with: BH q=0.10 over the family ledger; PSR/DSR with ledger trial count; PBO via CSCV (16 blocks) over the theta grid
min_n: 300
literature_ceiling: CLV vs Pinnacle close from public information is a few tenths of a percent at most; above +2% per bet is a leakage suspect
