id: closing-line-prediction-soft-book-vs-model-close-v1
family: closing-line-prediction
registered_at: 2026-10-20T21:20:00Z
author: quant-researcher
question: >
  Using the closing-line model that passed L2 on the move (closing-line-prediction-xg-finishing-v1: R2-Q2
  consensus-gap baseline + each team's shrunk Understat finishing luck), can a single named soft book's
  pre-closing price be backed at the football-data open snapshot and beat the de-vigged Pinnacle close (CLV)?
hypothesis:
  h1: >
    For book b, at the snapshot back the outcome with the largest log(price_b,o * p_hat_close_o) if it exceeds
    theta (one bet per match per book); mean CLV = log(price_b,o * p_pin_close_o) > 0.
  h0: mean CLV <= 0
  direction: positive
  disconfirming: >
    95% match-day block-bootstrap CI of mean CLV includes 0 or is below it; or sign negative in 2 of 3
    chronological thirds; or carried by one division.
decision_time: >
  The football-data pre-closing snapshot (Friday afternoon for Fri-Mon games, Tuesday afternoon for Tue-Thu
  games). The book's price is its pre-closing column (B365H/D/A, BWH/D/A, WHH/D/A in odds_all), assumed captured
  at the same snapshot as the Pinnacle open (not verifiable: no per-row timestamp). Model inputs are the xg
  hypothesis' point-in-time features (known_at < snapshot_date asserted) and *_open prices only.
universe: >
  E0, SP1, I1, D1, F1 matches in the xg-finishing-v1 evaluation universe (both teams with Understat history) with
  the book's three pre-closing prices present. p_hat_close comes from the registered xg-finishing-v1 walk-forward
  run with power de-vig (fitted on prior seasons only), read from
  data/research/r3/features/closing-line-prediction-xg-finishing-v1__power.parquet.
window:
  exploratory: [2015-07-01, 2019-06-30]
  evaluation: [2019-07-01, 2025-06-30]
benchmark: >
  Pinnacle close de-vigged by power (Shin as secondary metric clv_log_shin_close). Post segment 2025-07-01 ..
  2026-10-19: Betfair Exchange close de-vigged by power (secondary clv_log_post_betfair; model fitted on all
  Pinnacle seasons).
primary_metric: clv_log
secondary_metrics: [clv_log_shin_close, roi, clv_log_post_betfair]
costs: >
  The book's margin is inside the taken price; no commission. Stake limits on winning accounts at bet365 /
  William Hill / bwin are not modelled (a threat, not a cost).
grid:
  book: [B365, BW, WH]
  theta: [0.0, 0.02]
min_n: 300
literature_ceiling: >
  CLV vs Pinnacle close from public-information models is a few tenths of a percent at most; above +2% per bet over
  hundreds of bets is a leakage suspect.
notes: >
  Books pre-specified from open-price coverage only (no outcomes or closes examined): B365, BW and WH have
  pre-closing 1X2 coverage >= 0.6 in every evaluation season (IW stops 2023/24, VC stops 2024/25, LB/SJ/GB/BS absent).
  WH has no 2025/26 prices, so its post segment is empty. Quotes above 1.5x the Pinnacle open for the same outcome
  are treated as data errors and the outcome is not bet (R2 data-quality rule). ROI is flat 1-unit stakes, reported,
  never primary. Code: research/studies/r3-strategy/run.py.
